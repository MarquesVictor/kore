<!-- FONTE EDITÁVEL da imagem de compartilhamento (Open Graph), 1200×630.
     O site usa o og-image.png (redes sociais não aceitam SVG).
     Se alterar este arquivo, exporte de novo para PNG em 1200×630. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="kg" gradientUnits="userSpaceOnUse" x1="-6" y1="0" x2="84" y2="84">
      <stop offset="0%" stop-color="#D09AF8"/>
      <stop offset="55%" stop-color="#9B6CF6"/>
      <stop offset="100%" stop-color="#5A34F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#5A34F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5A34F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#09080F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Símbolo K com o Núcleo -->
  <g transform="translate(554 120) scale(1.3)">
    <line x1="14" y1="7" x2="14" y2="77" stroke="url(#kg)" stroke-width="11" stroke-linecap="round"/>
    <path d="M14 42 L58 9" stroke="url(#kg)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M14 42 L58 75" stroke="url(#kg)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="14" cy="42" r="10" fill="#9B6CF6" fill-opacity="0.18"/>
    <circle cx="14" cy="42" r="6" fill="#B07AF8"/>
    <circle cx="14" cy="42" r="2.8" fill="#EDE0FF"/>
  </g>

  <text x="611" y="350" text-anchor="middle" fill="#EDE8FF"
        font-family="Syne, sans-serif" font-weight="800" font-size="88" letter-spacing="22">KORE</text>
  <text x="600" y="430" text-anchor="middle" fill="#8881A8"
        font-family="DM Sans, sans-serif" font-size="32">Frota, logística e segurança do trabalho numa única plataforma</text>
</svg>
